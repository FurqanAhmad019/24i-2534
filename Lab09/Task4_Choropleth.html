<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Task 4: World Population Choropleth</title>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
            body {
                font-family: sans-serif;
                margin: 20px
            }

            h2 {
                margin: 0 0 8px
            }

            text {
                font-size: 12px
            }

            .tip {
                position: absolute;
                pointer-events: none;
                background: #222;
                color: #fff;
                padding: 6px 9px;
                border-radius: 4px;
                font-size: 12px;
                opacity: 0
            }
        </style>
    </head>
    <body>
        <h2>Task 4: World Population Choropleth</h2>
        <div class="tip" id="tip"></div>
        <div id="chart"></div>
        <script>
            const tip = d3.select("#tip");

            const showTip = (e, h) => tip.style("opacity", 1).html(h).style("left", (e.pageX + 12) + "px").style("top", (e.pageY + 12) + "px");

            const hideTip = () => tip.style("opacity", 0);

            const loadWorld = () => d3.json("dataset/world.geojson").catch(() => d3.json("https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson"));

            const W = 960, Ht = 520, svg = d3.select("#chart")
                .append("svg")
                .attr("width", W)
                .attr("height", Ht + 60);

            Promise.all([
                loadWorld(),
                d3.csv("population.csv", d3.autoType)
            ]).then(([world, pop]) => {
                const byId = new Map(pop.map(d => [d.id, d])), max = d3.max(pop, d => d.population_millions);

                const color = d3.scaleSequentialSqrt(d3.interpolateBlues).domain([0, max]);

                const proj = d3.geoNaturalEarth1().fitSize([W, Ht], world), path = d3.geoPath(proj);

                svg.append("g")
                    .selectAll("path")
                    .data(world.features)
                    .join("path")
                    .attr("d", path)
                    .attr("fill", d => byId.has(d.id) ? color(byId.get(d.id).population_millions) : "#e0e0e0")
                    .attr("stroke", "#fff")
                    .attr("stroke-width", .5)
                    .on("mousemove", function(e, d) {
                        const p = byId.get(d.id);

                        d3.select(this)
                            .raise()
                            .attr("stroke", "#000")
                            .attr("stroke-width", 1.5);

                        showTip(e, `<b>${d.properties.name}</b><br>${p ? p.population_millions + " million" : "No data"}`)
                    })
                    .on("mouseout", function() {
                        d3.select(this)
                            .attr("stroke", "#fff")
                            .attr("stroke-width", .5);

                        hideTip()
                    });

                const gr = svg.append("defs")
                    .append("linearGradient")
                    .attr("id", "gr");

                d3.range(0, 1.01, .1).forEach(t => gr.append("stop")
                    .attr("offset", t * 100 + "%")
                    .attr("stop-color", color(max * t * t)));

                const lg = svg.append("g")
                    .attr("transform", `translate(30,${Ht + 15})`);

                lg.append("rect")
                    .attr("width", 240)
                    .attr("height", 14)
                    .attr("fill", "url(#gr)");

                lg.append("text")
                    .attr("y", 30)
                    .text("0 M");

                lg.append("text")
                    .attr("x", 240)
                    .attr("y", 30)
                    .attr("text-anchor", "end")
                    .text(max + " M");

                lg.append("rect")
                    .attr("x", 300)
                    .attr("width", 14)
                    .attr("height", 14)
                    .attr("fill", "#e0e0e0");

                lg.append("text")
                    .attr("x", 320)
                    .attr("y", 12)
                    .text("No data");
            });
        </script>
    </body>
</html>
